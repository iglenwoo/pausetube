<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <circle cx="64" cy="64" r="60" fill="#6366f1"/>

  <!-- Power ring: 60° gap at top (gap from 240° to 300°) -->
  <!-- 240°: x=46, y=32.8  |  300°: x=82, y=32.8 -->
  <path d="M 82 32.8 A 36 36 0 1 1 46 32.8"
        fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- Power line through the gap -->
  <line x1="64" y1="19" x2="64" y2="44"
        stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- Play triangle (pointing right, inside ring) -->
  <polygon points="48,49 48,81 81,65" fill="white"/>
</svg>

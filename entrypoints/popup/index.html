<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .stats {
      font-size: 12px;
      color: #888;
      font-variant-numeric: tabular-nums;
    }

    .intent {
      color: #a5b4fc;
      font-size: 12px;
      font-style: italic;
      margin-bottom: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .intent.empty {
      display: none;
    }

    .snooze-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .snooze-label {
      font-size: 12px;
      color: #666;
    }

    .snooze-btn {
      flex: 1;
      padding: 10px 4px;
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .snooze-btn:hover {
      background: #2a2a3e;
      border-color: #6366f1;
    }

    /* Active snooze */
    .snooze-active {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a2e;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .snooze-active .remaining {
      font-size: 13px;
      color: #a5b4fc;
      font-variant-numeric: tabular-nums;
    }

    .snooze-cancel {
      padding: 6px 12px;
      background: none;
      border: 1px solid #333;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }

    .snooze-cancel:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .session-cancel {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 8px;
      background: none;
      border: 1px solid #2a2a3e;
      border-radius: 6px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .session-cancel:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    .session-cancel.hidden {
      display: none;
    }

    .footer {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .debug-link {
      flex: 1;
      display: block;
      padding: 6px;
      background: none;
      border: none;
      color: #555;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .debug-link:hover {
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PauseTube</h1>
    <span class="stats" id="stats">—</span>
  </div>

  <div class="intent empty" id="intent"></div>

  <div class="snooze-row" id="snooze-controls">
    <span class="snooze-label">Snooze</span>
  </div>

  <div class="snooze-active" id="snooze-active" style="display: none">
    <span class="remaining" id="snooze-remaining">—</span>
    <button class="snooze-cancel" id="snooze-cancel">End snooze</button>
  </div>

  <button class="session-cancel hidden" id="session-cancel">Cancel session</button>

  <div class="footer">
    <button class="debug-link" id="settings-link">⚙ Settings</button>
    <button class="debug-link" id="debug-link">🐞 Debug</button>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>

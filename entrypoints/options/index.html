<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PauseTube Settings</title>
  <meta name="manifest.open_in_tab" content="true" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 28px 20px 48px;
      max-width: 560px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.5;
    }

    h1 { font-size: 20px; font-weight: 600; }

    .sub { color: #8b8ba7; font-size: 13px; margin: 4px 0 22px; }

    .panel {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #818cf8;
      margin-bottom: 14px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-top: 1px solid #23233a;
    }

    .field:first-of-type { border-top: none; padding-top: 0; }

    .field-label { display: block; color: #e0e0e0; font-size: 14px; }
    .field-help { display: block; color: #6b7280; font-size: 12px; margin-top: 2px; }

    .control {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit { color: #6b7280; font-size: 12px; }

    input[type="number"] {
      background: #0f0f23;
      border: 1px solid #34344e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 8px 10px;
      width: 84px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Minute chips: one per snooze button, "+ Add" opens an inline input */
    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      max-width: 240px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #23233a;
      border: 1px solid #34344e;
      border-radius: 999px;
      color: #e0e0e0;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      padding: 4px 6px 4px 10px;
      white-space: nowrap;
    }

    .chip:not(:has(.chip-remove)) { padding-right: 10px; }

    .chip-remove {
      background: none;
      border: none;
      border-radius: 50%;
      color: #6b7280;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      width: 18px;
      height: 18px;
    }
    .chip-remove:hover { background: #34344e; color: #ef4444; }

    .chip-add {
      background: none;
      border: 1px dashed #34344e;
      border-radius: 999px;
      color: #8b8ba7;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 10px;
    }
    .chip-add:hover { border-color: #6366f1; color: #a5b4fc; }

    input[type="number"].chip-input {
      width: 64px;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 13px;
      text-align: center;
      appearance: textfield;
    }
    .chip-input::-webkit-inner-spin-button,
    .chip-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus { outline: none; border-color: #6366f1; }

    /* iOS-style toggle */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #2a2a3e;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: transform 0.15s;
    }
    input[type="checkbox"]:checked { background: #6366f1; }
    input[type="checkbox"]:checked::after { transform: translateX(18px); }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    #reset {
      background: none;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #8b8ba7;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #reset:hover { border-color: #ef4444; color: #ef4444; }

    #status { color: #34d399; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>PauseTube Settings</h1>
  <p class="sub">Tune the friction. There's no off switch, only dials.</p>

  <form id="form"></form>

  <div class="actions">
    <button id="reset" type="button">Reset to defaults</button>
    <span id="status"></span>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>

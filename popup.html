<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .header .version {
      font-size: 11px;
      color: #666;
    }

    /* Stats */
    .stats {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .stat-label {
      color: #888;
      font-size: 13px;
    }

    .stat-value {
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .intent-display {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #2a2a3e;
    }

    .intent-text {
      color: #a5b4fc;
      font-size: 12px;
      font-style: italic;
    }

    /* Snooze */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      margin-bottom: 10px;
    }

    .snooze-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .snooze-btn {
      padding: 8px 4px;
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .snooze-btn:hover {
      background: #2a2a3e;
      border-color: #6366f1;
    }

    .snooze-btn.active {
      background: #6366f1;
      border-color: #6366f1;
    }

    .snooze-start {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .snooze-start:hover {
      background: #4f46e5;
    }

    .snooze-start:disabled {
      background: #333;
      cursor: not-allowed;
    }

    /* Active snooze */
    .snooze-active {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .snooze-active p {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    .snooze-active .remaining {
      font-size: 20px;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 12px;
    }

    .snooze-cancel {
      padding: 8px 20px;
      background: none;
      border: 1px solid #333;
      border-radius: 8px;
      color: #888;
      font-size: 12px;
      cursor: pointer;
    }

    .snooze-cancel:hover {
      border-color: #ef4444;
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>OffTube</h1>
    <span class="version">v0.1</span>
  </div>

  <!-- Session Stats -->
  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">Session time</span>
      <span class="stat-value" id="stat-time">—</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Videos watched</span>
      <span class="stat-value" id="stat-videos">0</span>
    </div>
    <div class="intent-display" id="intent-display" style="display: none">
      <span class="stat-label">Intent:</span>
      <span class="intent-text" id="intent-text"></span>
    </div>
  </div>

  <!-- Snooze Controls (shown when NOT snoozed) -->
  <div id="snooze-controls">
    <div class="section-title">Snooze — Time</div>
    <div class="snooze-grid" id="time-options">
      <button class="snooze-btn" data-minutes="1">1m</button>
      <button class="snooze-btn" data-minutes="5">5m</button>
      <button class="snooze-btn" data-minutes="10">10m</button>
    </div>

    <div class="section-title">Snooze — Videos</div>
    <div class="snooze-grid" id="video-options">
      <button class="snooze-btn" data-videos="1">1</button>
      <button class="snooze-btn" data-videos="2">2</button>
      <button class="snooze-btn" data-videos="3">3</button>
    </div>

    <button class="snooze-start" id="snooze-start" disabled>Select a snooze option</button>
  </div>

  <!-- Active Snooze (shown when snoozed) -->
  <div id="snooze-active" class="snooze-active" style="display: none">
    <p>Snoozed</p>
    <div class="remaining" id="snooze-remaining">—</div>
    <button class="snooze-cancel" id="snooze-cancel">End snooze</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>

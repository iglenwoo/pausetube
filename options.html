<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OffTube Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 28px 20px 48px;
      max-width: 560px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.5;
    }

    h1 { font-size: 20px; font-weight: 600; }

    .sub { color: #8b8ba7; font-size: 13px; margin: 4px 0 22px; }

    .panel {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .panel h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #818cf8;
      margin-bottom: 14px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-top: 1px solid #23233a;
    }

    .field:first-of-type { border-top: none; padding-top: 0; }

    .field-label { display: block; color: #e0e0e0; font-size: 14px; }
    .field-help { display: block; color: #6b7280; font-size: 12px; margin-top: 2px; }

    .control {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .unit { color: #6b7280; font-size: 12px; }

    input[type="number"], input[type="text"] {
      background: #0f0f23;
      border: 1px solid #34344e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      padding: 8px 10px;
      width: 84px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="text"] { width: 140px; text-align: left; }
    input:focus { outline: none; border-color: #6366f1; }

    /* iOS-style toggle */
    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #2a2a3e;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e0e0e0;
      transition: transform 0.15s;
    }
    input[type="checkbox"]:checked { background: #6366f1; }
    input[type="checkbox"]:checked::after { transform: translateX(18px); }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    #reset {
      background: none;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #8b8ba7;
      font-size: 13px;
      padding: 8px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    #reset:hover { border-color: #ef4444; color: #ef4444; }

    #status { color: #34d399; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <h1>OffTube Settings</h1>
  <p class="sub">Tune the friction. There's no off switch — just dials.</p>

  <form id="form"></form>

  <div class="actions">
    <button id="reset" type="button">Reset to defaults</button>
    <span id="status"></span>
  </div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PauseTube Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f23;
      color: #e0e0e0;
      padding: 20px;
      max-width: 760px;
      margin: 0 auto;
      font-size: 13px;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    header h1 { font-size: 18px; font-weight: 600; }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tick { font-size: 11px; color: #6b7280; font-variant-numeric: tabular-nums; }

    .panel {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .panel h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #818cf8;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 5px 14px;
      font-variant-numeric: tabular-nums;
    }

    .grid .k { color: #8b8ba7; }
    .grid .v {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      word-break: break-word;
    }

    b { color: #fff; font-weight: 600; }
    .dim { color: #6b7280; }
    .ok { color: #34d399; }
    .err { color: #f87171; }
    .risk-high { color: #f87171; font-weight: 600; }
    .risk-snoozed { color: #a5b4fc; }
    .risk-none { color: #34d399; }

    .controls { display: flex; flex-direction: column; gap: 8px; }

    .ctl-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ctl-label {
      width: 84px;
      flex-shrink: 0;
      color: #8b8ba7;
      font-size: 12px;
    }

    button {
      background: #24243e;
      border: 1px solid #34344e;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
      transition: all 0.12s;
    }

    button:hover { background: #2f2f50; border-color: #6366f1; }

    input {
      background: #0f0f23;
      border: 1px solid #34344e;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 12px;
      padding: 6px 8px;
      width: 88px;
      font-family: "SF Mono", "Menlo", monospace;
    }

    input[type="text"] { width: 180px; }
    input:focus { outline: none; border-color: #6366f1; }

    .ctl-status { margin-top: 8px; font-size: 12px; min-height: 16px; }

    textarea {
      width: 100%;
      height: 260px;
      background: #0f0f23;
      border: 1px solid #34344e;
      border-radius: 8px;
      color: #c7d2fe;
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      padding: 10px;
      resize: vertical;
      margin-bottom: 8px;
    }

    textarea:focus { outline: none; border-color: #6366f1; }
  </style>
</head>
<body>
  <header>
    <h1>PauseTube Debug</h1>
    <div class="header-actions">
      <span class="tick" id="tick-status">live</span>
      <button id="pause-btn">⏸ Pause</button>
      <button id="copy-json-btn">Copy JSON</button>
    </div>
  </header>

  <section class="panel">
    <h2>Derived</h2>
    <div id="derived" class="grid"></div>
  </section>

  <section class="panel">
    <h2>Session</h2>
    <div id="session" class="grid"></div>
  </section>

  <section class="panel">
    <h2>Snooze</h2>
    <div id="snooze" class="grid"></div>
  </section>

  <section class="panel">
    <h2>Settings</h2>
    <div id="settings" class="grid"></div>
  </section>

  <section class="panel">
    <h2>Controls</h2>
    <div class="controls">
      <div class="ctl-row">
        <span class="ctl-label">Time</span>
        <button data-act="jump-risk">Jump to high risk</button>
        <button data-act="add" data-ms="60000">+1m</button>
        <button data-act="add" data-ms="30000">+30s</button>
        <button data-act="reset-elapsed">Reset to 0</button>
        <input id="set-elapsed" type="number" min="0" placeholder="sec" />
        <button data-act="set-elapsed">Set elapsed</button>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">Counters</span>
        <button data-act="add-video">videoCount +1</button>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">Snooze</span>
        <button data-act="snooze" data-min="1">1m</button>
        <button data-act="snooze" data-min="3">3m</button>
        <button data-act="snooze" data-min="5">5m</button>
        <button data-act="end-snooze">End snooze</button>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">Intent</span>
        <input id="set-intent" type="text" placeholder="intent text" />
        <button data-act="set-intent">Apply</button>
        <button data-act="clear-intent">Clear</button>
        <button data-act="just-browsing">Just browsing</button>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">Thresholds</span>
        <input id="set-highrisk" type="number" min="0" placeholder="highRisk s" />
        <button data-act="set-highrisk">Set highRisk</button>
        <input id="set-timeout" type="number" min="0" placeholder="timeout m" />
        <button data-act="set-timeout">Set timeout</button>
      </div>
      <div class="ctl-row">
        <span class="ctl-label">Lifecycle</span>
        <button data-act="reset-session">Reset session</button>
        <button data-act="age-activity">Age lastActivity past timeout</button>
      </div>
    </div>
    <div id="ctl-status" class="ctl-status"></div>
  </section>

  <section class="panel">
    <h2>Raw JSON — { session, snooze, settings }</h2>
    <textarea id="raw" spellcheck="false"></textarea>
    <div class="ctl-row">
      <button data-act="raw-load">Load current</button>
      <button data-act="raw-apply">Apply</button>
      <button data-act="raw-copy">Copy</button>
      <span id="raw-status" class="ctl-status"></span>
    </div>
  </section>

  <script src="debug.js"></script>
</body>
</html>
